name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Browser-safe values only: they ship inside the public JavaScript bundle anyway,
      # and row-level security protects the data. Never put the service_role / secret key here.
      VITE_SUPABASE_URL: https://dguoxzuzzuaauhpqqjjq.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRndW94enV6enVhYXVocHFxampxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMjkzOTYsImV4cCI6MjEwODkwNTM5Nn0.rSlu-JynXqH23NBFO0GB6xtWBYDLbtol_h43grJzDgA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
